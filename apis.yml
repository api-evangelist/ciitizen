aid: ciitizen
name: Ciitizen
description: >-
  Ciitizen is a digital health company that helps patients collect, organize,
  and control their own medical records. Founded by Anil Sethi and backed by
  a16z, Ciitizen built patient-directed tools for aggregating records across
  providers under HIPAA right-of-access, originally with a focus on cancer
  patients. The team and technology now operate as Citizen Health
  (citizen.health), which turns a patient's medical records into instant answers
  through an AI Advocate built for rare disease patients and caregivers and used
  by 100+ patient advocacy groups. Ciitizen exposes no public developer API,
  developer portal, or machine-readable API artifacts at this time; this profile
  captures the company identity and its live web presence.
